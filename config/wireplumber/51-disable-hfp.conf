# Keep WirePlumber out of HFP/HSP so HandsFree can own the profile + SCO.
#
# HandsFree registers its own HFP Hands-Free profile with BlueZ and manages
# the SCO transport directly. If WirePlumber also registers HFP, BlueZ returns
# org.bluez.Error.AlreadyExists. Declaring an explicit role allow-list that
# excludes hfp_hf/hfp_ag/hsp_hs/hsp_ag prevents WirePlumber from touching HFP,
# leaving only A2DP under its control.
#
# WirePlumber 0.5+ (SPA-JSON format). Lua configs are not supported on 0.5.
# Install to: ~/.config/wireplumber/wireplumber.conf.d/51-disable-hfp.conf

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}
